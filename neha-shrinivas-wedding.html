<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neha & Shrinivas – Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3e6cf;--paper2:#ead8b8;--ink:#5a3a12;--gold:#b8862b;--coral:#d9694f;--leaf:#7d8f5c;--line:rgba(184,134,43,.5)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cormorant Garamond',Georgia,serif;background:var(--paper);color:var(--ink);font-size:20px;line-height:1.6;overflow-x:hidden}
body.locked{overflow:hidden;height:100vh}
.caps{font-family:'Cinzel',Georgia,serif;letter-spacing:.22em;font-size:.72rem;text-transform:uppercase}
h1,h2{font-weight:500;line-height:1.1}
section{padding:90px 22px;max-width:980px;margin:auto;text-align:center;position:relative}
h2{font-size:clamp(2rem,6vw,3rem);margin-bottom:14px}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px auto 30px;color:var(--gold);max-width:300px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:var(--line)}
.lotus{width:34px;height:34px;fill:none;stroke:var(--gold);stroke-width:1.3}

/* ---------- OPENING ---------- */
#intro{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#2b1a08}
.door{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(135deg,var(--paper),var(--paper2));z-index:3;transition:transform 2.2s cubic-bezier(.7,0,.2,1) .3s;display:flex;align-items:center}
.door.l{left:0;justify-content:flex-end;border-right:2px solid var(--gold)}
.door.r{right:0;border-left:2px solid var(--gold)}
.door svg{width:60%;max-width:260px;opacity:.55}
#intro.open .l{transform:translateX(-101%)}
#intro.open .r{transform:translateX(101%)}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#f7e3b0 0,#e9c97f 35%,#2b1a08 80%);z-index:1;opacity:0;transition:opacity 1.5s}
#intro.open .glow{opacity:1}
.seal{position:relative;z-index:5;text-align:center;transition:opacity .6s,transform .6s}
.seal-circle{width:150px;height:150px;border-radius:50%;margin:0 auto 22px;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;background:var(--paper);box-shadow:0 0 0 8px rgba(243,230,207,.35),0 0 60px rgba(232,185,90,.6);animation:pulse 2.4s infinite}
.seal-circle span{font-size:2.6rem;font-style:italic;color:var(--ink)}
.seal p{color:#f3e6cf;margin-bottom:22px}
#openBtn{font:inherit;font-family:'Cinzel',serif;letter-spacing:.25em;font-size:.75rem;padding:14px 30px;background:transparent;color:#f3e6cf;border:1px solid var(--gold);cursor:pointer;transition:.3s}
#openBtn:hover,#openBtn:focus-visible{background:var(--gold);color:#2b1a08;outline:none}
#intro.open .seal{opacity:0;transform:scale(1.4)}
.bells{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-around;z-index:4;pointer-events:none;transition:opacity 1s}
#intro.open .bells{opacity:0}
.bell{transform-origin:top center;animation:sway 3s ease-in-out infinite}
.bell i{display:block;width:1px;height:calc(40px + var(--h,0px));background:var(--gold);margin:auto}
.bell b{display:block;width:30px;height:34px;background:var(--gold);border-radius:50% 50% 8px 8px/70% 70% 10% 10%;margin:auto}
.bell:nth-child(2n){animation-delay:-1.2s;--h:30px}.bell:nth-child(3n){animation-delay:-2s;--h:15px}
@keyframes sway{50%{transform:rotate(7deg)}0%,100%{transform:rotate(-7deg)}}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(243,230,207,.15),0 0 90px rgba(232,185,90,.9)}}

/* ---------- PETALS ---------- */
#petals{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.petal{position:absolute;top:-30px;width:14px;height:18px;border-radius:70% 0 70% 0;background:var(--coral);opacity:.8;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}

/* ---------- HERO ---------- */
#hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;max-width:none;padding:60px 20px;background:
 radial-gradient(ellipse at 50% 40%,rgba(255,248,230,.7),transparent 65%),var(--paper)}
.arch{width:min(560px,92vw);padding:70px 26px 60px;border:1.5px solid var(--line);border-radius:50% 50% 0 0/22% 22% 0 0;position:relative;background:rgba(255,250,238,.35)}
.arch::before{content:"";position:absolute;inset:8px;border:1px solid var(--line);border-radius:inherit;pointer-events:none}
.hero-names{font-size:clamp(2.6rem,10vw,4.4rem);text-transform:uppercase;letter-spacing:.02em}
.amp{font-style:italic;font-size:2.6rem;color:var(--gold);margin:6px 0}
.hero-meta{display:flex;justify-content:center;gap:22px;margin-top:34px;align-items:stretch}
.hero-meta div{padding:0 6px}.hero-meta .sep{width:1px;background:var(--line);padding:0}
.scroll{margin-top:44px;opacity:.8;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(8px)}}
.hang{position:absolute;top:0;width:60px;display:flex;flex-direction:column;align-items:center;gap:6px}
.hang.a{left:2%}.hang.b{right:2%}
.hang span{width:14px;height:14px;border-radius:50% 50% 50% 0;background:var(--coral);transform:rotate(-45deg)}
.hang span:nth-child(2n){background:#e9a37d}.hang span:nth-child(3n){background:var(--leaf);border-radius:0 60% 0 60%}
.hang::before{content:"";width:1px;height:50px;background:var(--leaf)}

/* ---------- BLESSING ---------- */
.blessing{font-size:1.35rem;font-style:italic;max-width:620px;margin:auto}
.blessing .sl{font-style:normal;color:var(--gold);margin-bottom:14px;font-size:1.5rem}

/* ---------- STORY ---------- */
.timeline{position:relative;max-width:640px;margin:40px auto 0;text-align:left}
.timeline::before{content:"";position:absolute;left:13px;top:6px;bottom:6px;width:1px;background:var(--line)}
.ev{position:relative;padding:0 0 34px 48px}
.ev::before{content:"";position:absolute;left:6px;top:8px;width:15px;height:15px;transform:rotate(45deg);background:var(--paper);border:1.5px solid var(--gold)}
.ev h3{font-size:1.5rem;font-weight:600}.ev .caps{color:var(--gold)}

/* ---------- EVENTS ---------- */
.events{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:30px;margin-top:30px}
.card{border:1.5px solid var(--line);padding:34px 22px 26px;background:rgba(255,250,238,.45);border-radius:140px 140px 4px 4px;position:relative}
.card h3{font-size:2rem;margin:10px 0 4px}
.card .when{font-size:1.2rem}
.card .where{margin:6px 0 18px;font-style:italic}
.card iframe{width:100%;height:230px;border:1px solid var(--line);filter:sepia(.5) saturate(.8);margin-bottom:16px}
.btn{display:inline-block;text-decoration:none;color:var(--ink);border:1px solid var(--gold);padding:11px 22px;font-family:'Cinzel',serif;letter-spacing:.2em;font-size:.7rem;transition:.3s;margin:3px}
.btn:hover,.btn:focus-visible{background:var(--gold);color:#fff;outline:none}

/* ---------- COUNTDOWN ---------- */
#count{background:linear-gradient(var(--paper2),var(--paper));max-width:none}
.timer{display:flex;justify-content:center;gap:clamp(10px,3vw,28px);margin-top:24px;flex-wrap:wrap}
.unit{width:clamp(72px,20vw,120px);padding:18px 4px;border:1.5px solid var(--line);border-radius:60px 60px 4px 4px;background:rgba(255,250,238,.5)}
.unit b{display:block;font-size:clamp(2rem,7vw,3.2rem);font-weight:500;line-height:1}
.unit .caps{font-size:.6rem}

/* ---------- GALLERY ---------- */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:30px}
.gallery figure{aspect-ratio:3/4;overflow:hidden;border:1.5px solid var(--line);border-radius:100px 100px 4px 4px;cursor:pointer;background:var(--paper2);display:flex;align-items:center;justify-content:center}
.gallery img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.gallery figure:hover img{transform:scale(1.07)}
.ph{opacity:.5;text-align:center;font-style:italic}
#lb{position:fixed;inset:0;background:rgba(30,18,5,.92);z-index:200;display:none;align-items:center;justify-content:center;cursor:zoom-out}
#lb.on{display:flex}#lb img{max-width:92vw;max-height:90vh;border:6px solid var(--paper)}

footer{padding:60px 20px 80px;text-align:center}
footer .names{font-size:2rem;font-style:italic}
#music{position:fixed;right:16px;bottom:16px;z-index:80;width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);background:var(--paper);color:var(--ink);cursor:pointer;display:none;font-size:1.1rem}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body class="locked">

<!-- ============ OPENING ANIMATION ============ -->
<div id="intro">
  <div class="glow"></div>
  <div class="bells" id="bells"></div>
  <div class="door l"><svg viewBox="0 0 100 200" fill="none" stroke="#b8862b" stroke-width="1.2"><path d="M100 0v200M100 40C60 40 40 70 40 100s20 60 60 60M100 70C80 75 65 90 65 100s15 25 35 30"/><circle cx="100" cy="100" r="6"/></svg></div>
  <div class="door r"><svg viewBox="0 0 100 200" fill="none" stroke="#b8862b" stroke-width="1.2" style="transform:scaleX(-1)"><path d="M100 0v200M100 40C60 40 40 70 40 100s20 60 60 60M100 70C80 75 65 90 65 100s15 25 35 30"/><circle cx="100" cy="100" r="6"/></svg></div>
  <div class="seal">
    <div class="seal-circle"><span id="seal-ini">N & S</span></div>
    <p class="caps">You are cordially invited</p>
    <button id="openBtn">OPEN INVITATION</button>
  </div>
</div>
<div id="petals"></div>
<button id="music" title="Music on/off" aria-label="Toggle music">♪</button>

<!-- ============ HERO ============ -->
<header id="hero">
  <div class="hang a" id="hangA"></div><div class="hang b" id="hangB"></div>
  <div class="arch">
    <svg class="lotus" viewBox="0 0 40 40"><path d="M20 6c-4 6-4 14 0 20 4-6 4-14 0-20zM8 14c2 8 7 12 12 12-1-7-5-11-12-12zM32 14c-2 8-7 12-12 12 1-7 5-11 12-12zM20 26c-5 0-9 3-12 6M20 26c5 0 9 3 12 6"/></svg>
    <p class="caps" style="margin-top:22px" data-k="intro"></p>
    <h1 class="hero-names" style="margin-top:26px"><span data-k="bride"></span><div class="amp">&amp;</div><span data-k="groom"></span></h1>
    <p class="caps" style="margin-top:34px" data-k="invite"></p>
    <div class="hero-meta">
      <div><p class="caps" id="h-date"></p></div><div class="sep"></div><div><p class="caps" id="h-place"></p></div>
    </div>
  </div>
  <div class="scroll caps">Scroll to discover our story<br>⌄</div>
</header>

<!-- ============ BLESSING ============ -->
<section id="blessing">
  <div class="orn"><svg class="lotus" viewBox="0 0 40 40"><path d="M20 6c-4 6-4 14 0 20 4-6 4-14 0-20zM8 14c2 8 7 12 12 12-1-7-5-11-12-12zM32 14c-2 8-7 12-12 12 1-7 5-11 12-12z"/></svg></div>
  <div class="blessing"><p class="sl" data-k="shloka"></p><p data-k="blessing"></p></div>
</section>

<!-- ============ STORY ============ -->
<section id="story">
  <h2>Our Story</h2><div class="orn">✦</div>
  <div class="timeline" id="timeline"></div>
</section>

<!-- ============ EVENTS ============ -->
<section id="events">
  <h2>Join Us</h2><div class="orn">✦</div>
  <div class="events" id="eventCards"></div>
</section>

<!-- ============ COUNTDOWN ============ -->
<section id="count">
  <h2>Counting Down to Our Wedding</h2><div class="orn">✦</div>
  <div class="timer" id="timer"></div>
  <p id="countMsg" style="margin-top:22px;font-style:italic"></p>
</section>

<!-- ============ GALLERY ============ -->
<section id="gallery">
  <h2>Moments Together</h2><div class="orn">✦</div>
  <div class="gallery" id="galleryGrid"></div>
</section>

<footer>
  <div class="orn"><svg class="lotus" viewBox="0 0 40 40"><path d="M20 6c-4 6-4 14 0 20 4-6 4-14 0-20zM8 14c2 8 7 12 12 12-1-7-5-11-12-12zM32 14c-2 8-7 12-12 12 1-7 5-11 12-12z"/></svg></div>
  <p data-k="closing"></p>
  <p class="names" style="margin-top:14px"><span data-k="bride"></span> &amp; <span data-k="groom"></span></p>
  <p class="caps" style="margin-top:14px" data-k="hashtag"></p>
</footer>
<div id="lb"><img alt=""></div>

<script>
/* =====================================================
   EDIT EVERYTHING HERE – no need to touch the rest.
   ===================================================== */
const CONFIG = {
  bride: "Neha",
  groom: "Shrinivas",
  intro: "Together with their families",
  invite: "Joyfully invite you to celebrate their wedding",
  hashtag: "#NehaWedsShrinivas",
  closing: "With love, and with gratitude for your presence.",

  shloka: "॥ शुभ विवाह ॥",
  blessing: "With the blessings of the Almighty and our elders, two hearts are becoming one. We humbly seek your presence and your heartfelt blessings as Neha and Shrinivas begin their journey of togetherness. Your love and good wishes will make our celebration complete.",

  // Format: YYYY-MM-DDTHH:mm:ss  (counts down to the wedding)
  weddingDateTime: "2027-02-14T11:30:00",

  events: [
    { title: "Wedding", date: "Thursday, 3 December 2026", time: "9:25 AM onwards",
      venue: " the Venue", address: "Full venue address, City, State",
      mapQuery: "Venue Name, City" },
    { title: "Reception", date: "Sunday, 14 February 2027", time: "7:00 PM onwards",
      venue: " Venue", address: "Full venue address, City, State",
      mapQuery: "Reception Venue, City" }
  ],

  story: [
    { when: "How we met",   title: "A chance hello",        text: "Our story began working together at the same airline. ✈️One day, in golden and black ,we unknowingly matched outfit and our eyes met amidst a crowd of colleagues. ✨A simple chai break turned into friendship, followed by our first ice cream date after shift. 🍦And just like that, a beautiful journey from friendship to love began, leading us to forever. ❤️" },
  ],

  // Add your photo paths or URLs here. Leave empty [] to show placeholders.
  photos: [
    // "photos/1.jpg", "photos/2.jpg", "photos/3.jpg"
  ],
  placeholderCount: 6,

  // Optional background music (e.g. "music/shehnai.mp3"). Leave "" for none.
  music: ""
};

/* ---------------- RENDER ---------------- */
const $ = s => document.querySelector(s);
document.querySelectorAll('[data-k]').forEach(el => el.textContent = CONFIG[el.dataset.k]);
$('#seal-ini').textContent = CONFIG.bride[0] + ' & ' + CONFIG.groom[0];
document.title = `${CONFIG.bride} & ${CONFIG.groom} – Wedding Invitation`;

const W = CONFIG.events[0];
$('#h-date').textContent = W.date.replace(/^\w+, /, '');
$('#h-place').textContent = W.venue;

$('#timeline').innerHTML = CONFIG.story.map(s =>
  `<div class="ev"><p class="caps">${s.when}</p><h3>${s.title}</h3><p>${s.text}</p></div>`).join('');

$('#eventCards').innerHTML = CONFIG.events.map(e => {
  const q = encodeURIComponent(e.mapQuery);
  return `<article class="card"><p class="caps" style="color:var(--gold)">${e.time}</p>
  <h3>${e.title}</h3><p class="when">${e.date}</p>
  <p class="where">${e.venue}<br><small>${e.address}</small></p>
  <iframe loading="lazy" title="Map of ${e.venue}" src="https://www.google.com/maps?q=${q}&output=embed"></iframe>
  <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q}">GET DIRECTIONS</a></article>`;
}).join('');

const g = $('#galleryGrid');
if (CONFIG.photos.length) {
  g.innerHTML = CONFIG.photos.map(p => `<figure><img loading="lazy" src="${p}" alt="${CONFIG.bride} and ${CONFIG.groom}"></figure>`).join('');
} else {
  g.innerHTML = Array.from({length: CONFIG.placeholderCount}, () => `<figure><span class="ph">Your photo<br>here</span></figure>`).join('');
}
g.addEventListener('click', e => {
  const im = e.target.closest('figure')?.querySelector('img'); if (!im) return;
  $('#lb img').src = im.src; $('#lb').classList.add('on');
});
$('#lb').onclick = () => $('#lb').classList.remove('on');

/* hanging flowers + bells */
const hang = () => Array.from({length: 7}, () => '<span></span>').join('');
$('#hangA').innerHTML = hang(); $('#hangB').innerHTML = hang();
$('#bells').innerHTML = Array.from({length: 6}, () => '<div class="bell"><i></i><b></b></div>').join('');

/* ---------------- COUNTDOWN ---------------- */
const target = new Date(CONFIG.weddingDateTime).getTime();
$('#timer').innerHTML = ['Days','Hours','Minutes','Seconds'].map(u =>
  `<div class="unit"><b id="t-${u}">00</b><span class="caps">${u}</span></div>`).join('');
function tick() {
  let d = target - Date.now();
  if (d <= 0) { ['Days','Hours','Minutes','Seconds'].forEach(u => $('#t-' + u).textContent = '00');
    $('#countMsg').textContent = 'Today is the day. Thank you for celebrating with us!'; return; }
  const v = { Days: Math.floor(d/864e5), Hours: Math.floor(d/36e5)%24, Minutes: Math.floor(d/6e4)%60, Seconds: Math.floor(d/1e3)%60 };
  for (const k in v) $('#t-' + k).textContent = String(v[k]).padStart(2, '0');
  $('#countMsg').textContent = `Until ${W.date}`;
}
tick(); setInterval(tick, 1000);

/* ---------------- OPENING SEQUENCE ---------------- */
function petals(n) {
  const box = $('#petals');
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div'); p.className = 'petal';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.setProperty('--dx', (Math.random() * 200 - 100) + 'px');
    p.style.animationDuration = (5 + Math.random() * 6) + 's';
    p.style.animationDelay = Math.random() * 3 + 's';
    p.style.background = ['#d9694f','#e9a37d','#f0c27a','#e98f9a'][i % 4];
    box.appendChild(p); setTimeout(() => p.remove(), 14000);
  }
}
let audio;
$('#openBtn').onclick = () => {
  $('#intro').classList.add('open');
  setTimeout(() => petals(45), 900);
  setTimeout(() => { $('#intro').style.display = 'none'; document.body.classList.remove('locked'); }, 3400);
  if (CONFIG.music) {
    audio = new Audio(CONFIG.music); audio.loop = true; audio.play().catch(() => {});
    const m = $('#music'); m.style.display = 'block';
    m.onclick = () => { audio.paused ? audio.play() : audio.pause(); m.style.opacity = audio.paused ? .5 : 1; };
  }
};
</script>
</body>
</html>
